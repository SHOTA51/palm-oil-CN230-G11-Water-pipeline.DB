
services:
  mysql:
    image: mysql:8.4
    container_name: plam-oil
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: aaa
      MYSQL_DATABASE: plam-oil
      MYSQL_USER: aaa
      MYSQL_PASSWORD: aaa

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro

volumes:
  mysql_data:
